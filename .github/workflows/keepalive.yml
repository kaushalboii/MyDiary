name: Keep Storage Server Awake

on:
  schedule:
    # Tick every 15 minutes (keeps intervals safely under 20-30 min despite cron queue jitter)
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping configured private storage server health endpoint
        env:
          MYDIARY_STORAGE_URL: ${{ secrets.MYDIARY_STORAGE_URL }}
        run: |
          if [ -z "$MYDIARY_STORAGE_URL" ]; then
            echo "No MYDIARY_STORAGE_URL secret configured; skipping keep-alive ping."
            exit 0
          fi
          curl -fsS --max-time 20 "${MYDIARY_STORAGE_URL%/}/api/health" >/dev/null
          echo "Keep-alive ping succeeded at $(date -u +%FT%TZ)"

