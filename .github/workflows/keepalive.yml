name: Keep Storage Server Awake

on:
  schedule:
    # Run every 5 minutes to guarantee traffic before 15-minute inactivity shutdown (even with GitHub Actions queue delays)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping configured storage server health endpoint
        env:
          MYDIARY_STORAGE_URL: ${{ secrets.MYDIARY_STORAGE_URL || vars.MYDIARY_STORAGE_URL }}
        run: |
          if [ -z "$MYDIARY_STORAGE_URL" ]; then
            echo "::error::No MYDIARY_STORAGE_URL configured! Please add MYDIARY_STORAGE_URL in your GitHub repository: Settings -> Secrets and variables -> Actions -> Secrets (or Variables)."
            exit 1
          fi

          TARGET_URL="${MYDIARY_STORAGE_URL%/}/api/health"
          echo "Pinging health endpoint: $TARGET_URL at $(date -u +%FT%TZ)"

          # Allow up to 60s for cold starts with automatic retries
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 --retry 2 --retry-delay 3 "$TARGET_URL" || true)

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Keep-alive ping succeeded with status $HTTP_STATUS at $(date -u +%FT%TZ)"
          else
            echo "::warning::Health check returned status $HTTP_STATUS"
            ROOT_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${MYDIARY_STORAGE_URL%/}/" || true)
            echo "Fallback root ping returned status $ROOT_STATUS"
            if [ "$ROOT_STATUS" -lt 200 ] || [ "$ROOT_STATUS" -ge 400 ]; then
              echo "::error::Both /api/health ($HTTP_STATUS) and / ($ROOT_STATUS) failed. Storage server may be unreachable."
              exit 1
            fi
          fi
